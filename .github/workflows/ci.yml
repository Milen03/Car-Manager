name: CI

# Lint, build and test on every push and pull request. Deploys happen on their
# own: Vercel builds the client and Railway builds the server from GitHub.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Lint and build client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Test server
        working-directory: server
        run: |
          npm ci
          npm test
