name: Deploy

# Manual deploys from Actions -> Deploy -> Run workflow. Runs the same
# scripts/deploy.sh you would run in Cloud Shell. Needs one repository secret,
# GCP_SERVICE_ACCOUNT; see DEPLOY.md.
on:
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        type: choice
        default: all
        options: [all, server, client]

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Lint and build client
        working-directory: client
        run: |
          npm ci
          npm run lint
          npm run build

      - name: Test server
        working-directory: server
        run: |
          npm ci
          npm test

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      # Exports GOOGLE_APPLICATION_CREDENTIALS, which both gcloud and the
      # Firebase CLI pick up.
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy
        run: ./scripts/deploy.sh "${{ inputs.target }}"
